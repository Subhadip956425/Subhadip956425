name: Generate Animated Banner

on:
  push:
    branches:
      - main
    paths:
      - 'projects.json'
      - '.github/scripts/**'
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # scipy, numpy, and pillow are required for the logo morphing math
          pip install numpy scipy pillow 

      - name: Generate SVGs
        run: python .github/scripts/generate_banner.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dark.svg light.svg
          git commit -m "chore: auto-generate updated profile banner" || exit 0
          git push
